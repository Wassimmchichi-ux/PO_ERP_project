services:
  db:
    image: postgres:15-alpine
    container_name: po_postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-po_database}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-po_database}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: po_fastapi_backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-po_database}
      - ENVIRONMENT=development
      - DEBUG=false
      - ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - SECRET_KEY=supersecretkey_change_in_production
    command: sh -c "python -m app.db.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./ressources/business-test:/business-test:ro

  frontend:
    image: node:22-alpine
    container_name: po_frontend
    working_dir: /app
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:8080
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

    
  schemaspy:
    image: schemaspy/schemaspy:latest
    profiles:
      - tools

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./schemaspy-output:/output

    command:
      - -t
      - pgsql11
      - -host
      - db
      - -port
      - "5432"
      - -db
      - po_database
      - -u
      - postgres
      - -p
      - postgres
      - -s
      - public

volumes:
  pgdata:
  frontend_node_modules:
